name: PROD Pipeline

on:
  push:
    branches:
      - prod

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Download model v1
        run: |
          aws s3 cp \
          s3://${{ secrets.AWS_BUCKET_NAME }}/models/breast_cancer_v1.onnx \
          artifacts/breast_cancer_v1.onnx

      - name: Download model v2
        run: |
          aws s3 cp \
          s3://${{ secrets.AWS_BUCKET_NAME }}/models/breast_cancer_v2.onnx \
          artifacts/breast_cancer_v2.onnx

      - name: Download test dataset
        run: |
          aws s3 cp \
          s3://${{ secrets.AWS_BUCKET_NAME }}/test-data/breast_cancer_test.csv \
          artifacts/breast_cancer_test.csv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  build:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t breast-cancer-api .